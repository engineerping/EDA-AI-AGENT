function show(n){
  document.querySelectorAll('.layer').forEach(l=>l.classList.remove('active'));
  document.getElementById('layer-'+n).classList.add('active');
  const d=data[n];
  const cls=d.cls;
  let html=`<h3>${d.title}</h3><p class="tagline">${d.tagline}</p>`;
  d.sections.forEach(s=>{
    html+=`<div class="section-title">${s.title}</div><ul class="items">`;
    s.items.forEach(item=>{
      html+=`<li><span class="dot dot-${cls}"></span><span>${item}</span></li>`;
    });
    html+=`</ul>`;
  });
  html+=`<div class="real-world"><strong>真实案例：</strong>${d.real}</div>`;
  document.getElementById('detail').innerHTML=html;
}
